<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout Lab</title><style>body{font-family:system-ui;background:#f5f7fb;color:#17213a;margin:0}main{max-width:620px;margin:60px auto;background:white;padding:40px;border-radius:18px;box-shadow:0 8px 40px #1b31501a}h1{margin-top:0}label{display:block;margin-top:18px}input{display:block;width:96%;padding:12px;margin-top:8px;border:1px solid #abb8ce;border-radius:8px}button{margin-top:24px;padding:14px 25px;background:#1565c0;color:white;border:0;border-radius:8px;cursor:pointer}.status{margin-top:20px;font-weight:700}</style></head><body><main><h1>Checkout Lab</h1><p>Sample application for Selenium locator-healing exercises.</p><label for="customer-name">Customer name</label><input id="customer-name" name="customer" placeholder="Your name"/><label for="email-address">Email</label><input id="email-address" name="email" type="email" placeholder="you@example.com"/><button id="submit-order" type="button">Place order</button><p id="order-status" class="status" role="status"></p></main><script>const changed=new URLSearchParams(location.search).get('version')==='2';if(changed){document.querySelector('#customer-name').id='buyer-full-name';document.querySelector('#email-address').id='contact-email';document.querySelector('#submit-order').id='confirm-purchase';}document.querySelector('button').addEventListener('click',()=>{const name=document.querySelector('input[name=customer]').value.trim();const email=document.querySelector('input[name=email]').value.trim();document.querySelector('[role=status]').textContent=name&&email.includes('@')?'Order placed for '+name:'Enter a name and valid email';});</script></body></html>
